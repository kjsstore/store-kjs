<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KEMET JS STORE | PREMIUM EDITION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold-primary: #D4AF37;
            --gold-light: #FFD700;
            --fire-red: #FF4500;
            --dark-bg: #050505;
            --dark-surface: #121212;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --fire-glow: rgba(255, 69, 0, 0.4);
            --wa-green: #25D366;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding-bottom: 80px;
            color: #fff;
            background: var(--dark-bg);
            overflow-x: hidden;
        }

        /* Scanline / Grainy Effect for Cyber Look */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.3;
        }

        header { 
            background: linear-gradient(180deg, #1a1a1a 0%, #000 100%); 
            padding: 1rem; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 2px solid var(--gold-primary);
            box-shadow: 0 4px 20px var(--fire-glow);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-area img {
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 10px var(--gold-primary);
        }
        .header-title {
            font-weight: 800; 
            color: var(--gold-light); 
            font-size: 1.2rem; 
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Banner Flame Style */
        .promo-banner {
            background: linear-gradient(45deg, #000, #400000);
            margin: 15px;
            padding: 25px;
            border-radius: 15px;
            color: white;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--fire-red);
            box-shadow: inset 0 0 20px var(--fire-glow);
        }
        .promo-banner h2 { 
            margin: 0; 
            font-size: 1.3rem; 
            color: var(--gold-light);
            position: relative;
            z-index: 2;
        }
        .promo-banner p { margin: 5px 0 0; font-size: 0.85rem; opacity: 0.9; position: relative; z-index: 2;}
        .promo-banner i {
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 100px;
            color: var(--fire-red);
            opacity: 0.3;
            transform: rotate(-15deg);
        }

        .container { max-width: 600px; margin: 0 auto; padding: 0 12px; }

        .premium-card { 
            background: var(--dark-surface); 
            border: 1px solid rgba(212, 175, 55, 0.2); 
            border-radius: 15px; 
            padding: 1.5rem; 
            margin-bottom: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* Search Box Gold Style */
        .search-box {
            display: flex;
            background: #1a1a1a;
            padding: 5px;
            border-radius: 10px;
            border: 1px solid var(--gold-primary);
            box-shadow: 0 0 15px var(--gold-glow);
        }
        .search-box input {
            flex: 1;
            padding: 12px;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            color: #fff;
        }
        .search-box button {
            background: linear-gradient(45deg, var(--gold-primary), var(--gold-light));
            border: none;
            color: #000;
            padding: 0 25px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }
        .search-box button:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--gold-light); }

        /* Button Style */
        .btn-main { 
            width: 100%; 
            padding: 14px;
            border: none; 
            border-radius: 10px; 
            font-weight: 800; 
            cursor: pointer; 
            font-family: 'Plus Jakarta Sans'; 
            margin-top: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-gold { 
            background: linear-gradient(45deg, #8B6B1E, var(--gold-primary)); 
            color: black; 
        }

        /* Result Cards Style */
        .card-result { 
            background: #1a1a1a; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            overflow: hidden; 
            border: 1px solid #333;
            transition: 0.3s;
        }
        .card-result:hover { border-color: var(--fire-red); box-shadow: 0 0 15px var(--fire-glow); }

        .result-header { 
            background: #222; 
            padding: 10px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #333; 
        }
        .badge-id {
            background: rgba(255, 69, 0, 0.1);
            color: var(--fire-red);
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 800;
            border: 1px solid var(--fire-red);
        }

        pre { 
            background: #0a0a0a; 
            padding: 15px; 
            color: #00ff00; /* Neon green code like Matrix */
            font-size: 12px; 
            white-space: pre-wrap; 
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
        }

        .mini-btn { padding: 8px 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 11px; }
        .copy-btn { background: #333; color: #fff; }
        .wa-btn { background: var(--wa-green); color: white; display: flex; align-items: center; gap: 5px; text-decoration: none; }
        
        .float-admin {
            position: fixed;
            bottom: 25px;
            left: 20px;
            background: #000;
            color: var(--gold-primary);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 998;
            cursor: pointer;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .db-info { font-size: 11px; color: var(--gold-light); text-align: center; margin-top: 15px; font-weight: bold; }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #555;
        }
        .empty-state i { font-size: 50px; color: #222; margin-bottom: 15px; }

    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="musik.mp3" type="audio/mpeg">
</audio>

<header>
    <div class="logo-area">
        <img src="logo.png" alt="KJS" onerror="this.src='https://i.ibb.co/vzB7pYn/temp-logo.jpg'">
        <span class="header-title">RUANG DATER SE-INDONESIA 🇮🇩</span>
    </div>
    <div style="display: flex; gap: 15px; align-items: center;">
        <i class="fas fa-volume-mute" id="musicBtn" onclick="toggleMusic()" style="color: var(--gold-primary); cursor: pointer; font-size: 1.2rem;"></i>
        <i class="fas fa-crown" style="color: var(--gold-light);"></i>
    </div>
</header>

<div class="promo-banner">
    <h2><i class="fas fa-fire"></i> KJS PREMIUM ACCESS</h2>
    <p>Database Eksklusif & High-Quality Data Redy 2026</p>
    <i class="fas fa-crown"></i>
</div>

<div class="container">
    <div class="premium-card">
        <div class="search-box">
            <input type="text" id="search-free" placeholder="Cari langsung, daerah, Lokasi..." autocomplete="off">
            <button onclick="searchData()">SCAN</button>
        </div>
        <div style="margin-top: 15px; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px;">
            <span style="font-size: 10px; background: #8B0000; color: #fff; padding: 5px 12px; border-radius: 5px; white-space: nowrap; border: 1px solid var(--fire-red);">#REDY_ACCESS</span>
            <span style="font-size: 10px; background: #333; color: var(--gold-light); padding: 5px 12px; border-radius: 5px; white-space: nowrap; border: 1px solid var(--gold-primary);">#BASIL_KJS</span>
            <span style="font-size: 10px; background: #333; color: #fff; padding: 5px 12px; border-radius: 5px; white-space: nowrap;">#FRESH_DATA</span>
        </div>
    </div>

    <div id="admin-panel" class="premium-card" style="display:none; border-left: 4px solid var(--gold-primary);">
        <div style="color: var(--gold-light); font-weight: bold; margin-bottom: 15px; font-size: 14px; letter-spacing: 1px;">DASHBOARD FOUNDER</div>
        <input type="file" id="file-input" hidden accept=".txt">
        <button class="btn-main" style="background: #000; color: var(--gold-primary); border: 1px dashed var(--gold-primary);" onclick="document.getElementById('file-input').click()">
            <i class="fas fa-upload"></i> LOAD NEW DATABASE
        </button>
        
        <button id="btn-process" class="btn-main btn-gold">
            <i class="fas fa-bolt"></i> EXECUTE INJECTION
        </button>
        
        <div id="preview-container" style="display:none; margin-top:10px; background:#000; border-radius:8px; padding:10px; border: 1px solid #333;">
            <div id="preview-list" style="max-height:100px; overflow-y:auto; font-size:10px; color: #0f0; font-family: monospace;"></div>
            <button id="btn-confirm-save" class="btn-main btn-gold" style="margin-top:10px;">SAVE TO CLOUD</button>
        </div>

        <button onclick="clearAllData()" class="btn-main" style="background:transparent; color:#ff4747; font-size: 11px; border: 1px solid #440000; margin-top: 20px;">
            <i class="fas fa-skull"></i> DESTROY ALL RECORDS
        </button>
        <div class="db-info" id="db-count">SYSTEM READY</div>
    </div>

    <div id="hasil-container">
        <div class="empty-state">
            <i class="fas fa-fingerprint"></i>
            <p>Waiting for secure search input...</p>
        </div>
    </div>
</div>

<div class="float-admin" onclick="adminLogin()">
    <i class="fas fa-key"></i>
</div>

<div id="adminModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.95); display:none; align-items:center; justify-content:center; z-index:2000; backdrop-filter:blur(15px);">
    <div style="width:85%; max-width:320px; background:var(--dark-surface); border: 2px solid var(--gold-primary); border-radius:20px; padding:40px 30px; text-align: center; box-shadow: 0 0 30px var(--gold-glow);">
        <i class="fas fa-shield-alt" style="font-size: 50px; color: var(--gold-primary); margin-bottom: 20px;"></i>
        <div style="font-weight: 800; color: #fff; margin-bottom: 20px; letter-spacing: 2px;">SECURE LOGIN</div>
        <input type="password" id="adminPassword" placeholder="ACCESS PIN"
            style="width:100%; padding:15px; background:#000; border:1px solid var(--gold-primary); border-radius:10px; outline:none; margin-bottom:15px; text-align: center; font-weight: bold; color: var(--gold-light);">
        <button onclick="checkAdminLogin()" style="width:100%; padding:15px; border:none; border-radius:10px; background:linear-gradient(45deg, var(--gold-primary), var(--gold-light)); color:#000; font-weight: 900; cursor:pointer;">ACCESS SYSTEM</button>
        <div onclick="closeAdminModal()" style="margin-top: 20px; font-size: 11px; color: #666; cursor: pointer; text-transform: uppercase;">Abort Mission</div>
    </div>
</div>

<script>
    // Konfigurasi Store
    const ADMIN_WA = "6281234567890"; // GANTI NOMOR WA DISINI
    const STORE_PIN = "kemet2026";    // PIN ADMIN BARU

    let localDatabase = JSON.parse(localStorage.getItem('kemetStore_DB')) || [];
    let tempStorage = [];

    function adminLogin() {
        document.getElementById("adminModal").style.display = "flex";
    }

    function closeAdminModal() {
        document.getElementById("adminModal").style.display = "none";
    }

    function checkAdminLogin() {
        const pwd = document.getElementById("adminPassword").value;
        if (pwd === STORE_PIN) { 
            document.getElementById('admin-panel').style.display = 'block';
            closeAdminModal();
            alert("ACCESS GRANTED. Welcome back, Boss.");
        } else {
            alert("ACCESS DENIED. WRONG PIN.");
        }
    }

    function updateSystemUI() {
        document.getElementById('db-count').innerHTML = `RECORDS ENCRYPTED: ${localDatabase.length}`;
    }

    document.getElementById('file-input').addEventListener('change', (e) => {
        if(e.target.files[0]) alert("File Ready: " + e.target.files[0].name);
    });

    document.getElementById('btn-process').addEventListener('click', () => {
        const file = document.getElementById('file-input').files[0];
        if(!file) return alert("Select .txt source first!");
        
        const reader = new FileReader();
        reader.onload = (e) => {
            const rawText = e.target.result;
            const blocks = rawText.split(/🛑══BERHASIL══🛑/g);
            const previewList = document.getElementById('preview-list');
            previewList.innerHTML = "";
            tempStorage = [];
            
            blocks.forEach((block, index) => {
                const text = block.trim();
                if(text.length < 10) return;
                
                const namaMatch = text.match(/Nama\s*[:\-\s]*([A-Za-z\s\.]+)/i) || text.match(/➬\s*:\s*([A-Za-z\s\.]+)/i);

                const item = {
                    id: Date.now() + index,
                    nama: namaMatch ? namaMatch[1].trim() : "Unknown",
                    raw: text
                };
                
                tempStorage.push(item);
                previewList.innerHTML += `<div>[OK] INJECTING: ${item.nama}</div>`;
            });
            document.getElementById('preview-container').style.display = 'block';
        };
        reader.readAsText(file);
    });

    document.getElementById('btn-confirm-save').addEventListener('click', () => {
        localDatabase = [...localDatabase, ...tempStorage];
        localStorage.setItem('kemetStore_DB', JSON.stringify(localDatabase));
        alert("Injection Success! " + tempStorage.length + " Items Added.");
        tempStorage = [];
        document.getElementById('preview-container').style.display = 'none';
        updateSystemUI();
    });

    function searchData() {
        const keyword = document.getElementById('search-free').value.toLowerCase().trim();
        const container = document.getElementById('hasil-container');
        if(!keyword) return;

        const results = localDatabase.filter(d => d.raw.toLowerCase().includes(keyword));
        container.innerHTML = "";

        if (results.length === 0) {
            container.innerHTML = `<div class="empty-state">
                <i class="fas fa-ghost"></i>
                <p>TIDAK DI TEMUKAN ATAU STOK BELUM REDY 🙏.</p>
            </div>`;
            return;
        }

        results.forEach((res) => {
            const div = document.createElement('div');
            div.className = 'card-result';
            div.innerHTML = `
                <div class="result-header">
                    <span class="badge-id"><i class="fas fa-check-circle"></i> VERIFIED DATA</span>
                    <div style="display:flex; gap:8px;">
                        <button class="mini-btn copy-btn" onclick="copyText(this)">COPY</button>
                        <button class="mini-btn wa-btn" onclick="waOrder(this)"><i class="fab fa-whatsapp"></i> BUY</button>
                    </div>
                </div>
                <pre>${res.raw}</pre>
            `;
            container.appendChild(div);
        });
    }

    function waOrder(btn) {
        const pre = btn.closest('.card-result').querySelector('pre').innerText;
        const message = `Halo Kemet JS Store, saya berminat dengan data ini:\n\n${pre}\n\nInfo harga dan pembayarannya Boss.`;
        window.open(`https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(message)}`, '_blank');
    }

    function copyText(btn) {
        const text = btn.closest('.card-result').querySelector('pre').innerText;
        navigator.clipboard.writeText(text);
        btn.innerHTML = "DONE!";
        setTimeout(() => btn.innerText = "COPY", 1000);
    }

    function clearAllData() {
        if(confirm("DANGER! This will wipe the entire store. Proceed?")) {
            localStorage.removeItem('kemetStore_DB');
            localDatabase = [];
            updateSystemUI();
            location.reload();
        }
    }

    function toggleMusic() {
        const audio = document.getElementById("bgMusic");
        const icon = document.getElementById("musicBtn");
        if (audio.paused) {
            audio.play().catch(() => alert("Klik di mana saja dulu agar musik bisa jalan!"));
            icon.classList.replace("fa-volume-mute", "fa-music");
        } else {
            audio.pause();
            icon.classList.replace("fa-music", "fa-volume-mute");
        }
    }

    updateSystemUI();
</script>

</body>
</html>
